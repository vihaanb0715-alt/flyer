<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Slider</title>
    <style>
        /* Reset and Fullscreen Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Slider Container */
        .slider-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            transform: translateX(0);
        }

        /* Individual Slides */
        .slide {
            position: relative;
            min-width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Slide 1 Image */
        .slide-1 {
            background-image: url('./uperhero (1).gif');
        }

        /* Slide 2 Image */
        .slide-2 {
            background-image: url('./uperhero (1).gif');
        }

        /* Superhero Button Styling */
        .hero-btn {
            background: linear-gradient(135deg, #ffcc00 0%, #ff3300 100%);
            color: #1a1a1a;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 20px 45px;
            border: 4px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 0, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.5);
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4);
            transform: scale(0);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Active state when second slide shows */
        .slide-2.active .hero-btn {
            transform: scale(1);
            opacity: 1;
        }

        /* Hover effect for action feel */
        .hero-btn:hover {
            background: linear-gradient(135deg, #ffe680 0%, #ff4d4d 100%);
            transform: scale(1.08);
            box-shadow: 0 15px 35px rgba(255, 51, 0, 0.9);
        }

        .hero-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="slider-container" id="slider">
        <!-- First Picture -->
        <div class="slide slide-1"></div>
        
        <!-- Second Picture with Superhero Button -->
        <div class="slide slide-2" id="slide2">
            <button class="hero-btn" onclick="alert('POW! Action activated!')">Join the League</button>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const slide2 = document.getElementById('slide2');

        // Automatically slide to the second image after 4 seconds
        setTimeout(() => {
            slider.style.transform = 'translateX(-100vw)';
            slide2.classList.add('active');
        }, 4000);
    </script>

</body>
</html>
